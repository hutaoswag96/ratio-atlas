<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132a33"><title>比值手记</title><link rel="stylesheet" href="research.css"><script defer src="history.js"></script><script defer src="engine.js"></script><script defer src="research.js"></script></head>
<body><header><div class="mast"><a class="brand" href="#equity"><span class="monogram" aria-hidden="true">∕</span>比值手记 <em>Ratio Atlas</em></a><nav aria-label="资产对"><a href="#equity">红利 / 创业板</a><a href="#gold">黄金 / 美债</a></nav></div></header>
<main><section class="headline"><div><div class="over" id="market"></div><h1 id="title"></h1></div><div class="stamp"><span>周度研究快照</span><b id="date"></b></div></section>
<section class="terminal" aria-label="行情与区间"><div class="chartpane"><div class="quote"><div><span class="dim">收盘比值</span><strong id="quote"></strong></div><div id="change"></div><div id="ranges" class="segments" aria-label="走势图区间"></div></div><div id="plot"></div><div class="chartfoot"><span><i class="line"></i>比值周线</span><span><i class="dotted"></i>季度中位线</span><span><i class="dot"></i>分批首笔信号</span><span id="chartPeriod"></span></div></div><aside><div class="over">季度参考区间</div><h2 id="zone"></h2><small id="cal"></small><div id="ladder"></div><p id="fresh" class="fresh"></p><a id="legacy">查看原固定线及自定义区间 ↗</a></aside></section>
<div id="assets" class="assets"></div>
<section class="module"><div class="sectionhead"><div><div class="over">资金分配</div><h2>这一轮怎么做</h2></div><div class="segLight" id="modes"><button data-mode="entry">现金分批建仓</button><button data-mode="monthly">已有两项持仓</button></div></div>
<div class="planner"><div class="planLead"><h3 id="planTitle"></h3><p id="planCopy"></p><label id="experiment" class="checkbox"><input type="checkbox" id="confirmation">试算转强补仓</label><label>专项模拟预算（元）<input id="budget" type="number" min="1" max="100000000" step="any" value="10000"></label><small>仅包含拨给这一组资产的资金。</small></div><div><div id="steps"></div><div id="now" class="notice" aria-live="polite"></div></div></div></section>
<section class="module"><div class="sectionhead"><div><div class="over">同区间历史试算</div><h2>多做交易，结果如何</h2></div><small id="testPeriod"></small></div><div id="finding"></div><div class="scroll"><table><thead><tr><th>策略</th><th>首笔轮数 / 调仓次数</th><th>累计收益</th><th>年化收益</th><th>最大回撤</th></tr></thead><tbody id="bench"></tbody></table></div><p id="limits" class="fine"></p></section>
<section class="module"><div class="sectionhead"><div><div class="over">执行明细</div><h2 id="logTitle"></h2></div><select id="filter" aria-label="筛选历史方向"></select></div><p id="logInfo"></p><div id="log" class="scroll"></div><button id="more" class="subtle">查看更多记录</button></section>
<details class="module method"><summary>计算方法、风险与数据来源</summary><div id="method"></div></details></main><footer>比值手记 <em>Ratio Atlas</em> <span>个人投资研究</span></footer></body></html>
