<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18283d"><title>比值手记 · 个人投资观察台</title><link rel="stylesheet" href="style.css"><script defer src="history.js"></script><script defer src="app.js"></script></head><body>
<header><div class="bar"><a class="brand" href="#equity"><span class="mark" aria-hidden="true">∕</span><b>比值手记</b><small>RATIO ATLAS</small></a><nav aria-label="资产对"><a href="#equity">红利 / 创业板</a><a href="#gold">黄金 / 美债</a></nav></div></header>
<main><section class="heading"><div><div class="category" id="category"></div><h1 id="title"></h1><p id="intro"></p></div><span class="date" id="asof"></span></section>
<div id="stats"></div><section class="analysis"><article class="panel chartpanel"><div class="paneltop"><div><h2>比值走势</h2><small id="period"></small></div><div class="switch" id="range" aria-label="显示区间"></div></div><div id="plot"></div><div class="legend" id="legend"></div></article>
<aside class="panel"><div class="paneltop"><h2>建仓参考区</h2><button id="edit">调整</button></div><div id="zones"></div><div id="ruleNote"></div></aside></section>
<section><div class="sectitle"><h2>资产走势</h2><small>与主图同区间 · 各自独立刻度</small></div><div id="assets"></div></section>
<section class="panel records"><div class="paneltop"><div><h2>历史触线记录</h2><small id="recordInfo"></small></div><div class="filters"><select id="sample" aria-label="记录样本"><option value="after">定线后</option><option value="all">全历史回看</option></select><select id="direction" aria-label="筛选信号方向"></select></div></div><div class="scroll"><table><thead><tr><th>信号周</th><th>观察方向</th><th>触线比值</th><th>52 周涨跌</th><th>相对另一侧¹</th><th>最大回撤</th><th>回本周数²</th></tr></thead><tbody id="events"></tbody></table></div><div class="recordfoot"><small id="recordCount"></small><button id="more">查看更多</button></div></section>
<details class="panel method"><summary>计算口径与数据来源</summary><div id="method"></div></details></main><footer>比值手记 <span>个人投资观察台</span></footer>
<dialog id="settings"><form id="form"><h2>调整建仓参考区</h2><p id="editNote"></p><div id="fields"></div><p id="err" role="alert"></p><div class="actions"><button type="button" id="reset">填入默认值</button><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存</button></div></form></dialog></body></html>
